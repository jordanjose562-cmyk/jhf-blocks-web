<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>JHF Desafíos</title>
  <link rel="stylesheet" href="css/estilo.css">
  <style>
    /* Capa superpuesta para la bienvenida y descargas */
    .pantalla-bienvenida {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .hero-titulo {
      font-size: 2.2rem;
      color: #333;
      margin-bottom: 10px;
    }

    .hero-subtitulo {
      font-size: 1.1rem;
      color: #666;
      max-width: 600px;
      margin-bottom: 30px;
    }

    .btn-jugar-destacado {
      font-size: 1.4rem;
      padding: 16px 36px;
      background-color: #28a745;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
      transition: transform 0.2s, background-color 0.2s;
      margin-bottom: 40px;
    }

    .btn-jugar-destacado:hover {
      background-color: #218838;
      transform: scale(1.05);
    }

    .caja-descargas {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 10px;
      padding: 20px 30px;
      max-width: 500px;
      width: 100%;
    }

    .caja-descargas h3 {
      margin-top: 0;
      margin-bottom: 15px;
      color: #495057;
    }

    .grupo-descargas {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-descargar-app {
      display: inline-block;
      padding: 10px 20px;
      background-color: #007bff;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }

    .btn-descargar-app:hover {
      background-color: #0056b3;
    }

    /* Clase para ocultar suavemente el inicio */
    .ocultar-pantalla {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- ======================================================= -->
  <!-- 1. PANTALLA DE BIENVENIDA Y BOTONES DE DESCARGA        -->
  <!-- ======================================================= -->
  <div id="pantallaBienvenida" class="pantalla-bienvenida">
    <h1 class="hero-titulo">Bienvenido a JHF Desafíos</h1>
    <p class="hero-subtitulo">Aprende lógica y conceptos de programación resolviendo los retos interactivos con bloques.</p>

    <!-- Botón principal para jugar online -->
    <button id="btnJugarOnline" class="btn-jugar-destacado" type="button">¡Programá y divertite!</button>

    <!-- Sección de descargas -->
    <div class="caja-descargas">
      <h3>Descarga la aplicación</h3>
      <div class="grupo-descargas">
        <!-- Reemplaza los enlaces "href" según la ubicación de tus instaladores -->
        <a href="descargas/JHF-Desafios-Windows.exe" class="btn-descargar-app" download>Windows</a>
        <a href="descargas/JHF-Desafios-Android.apk" class="btn-descargar-app" download>Android</a>
        <a href="descargas/JHF-Desafios-Linux.AppImage" class="btn-descargar-app" download>Linux</a>
      </div>
    </div>
  </div>

  <!-- ======================================================= -->
  <!-- 2. ESTRUCTURA COMPLETA DE TU JUEGO ORIGINAL             -->
  <!-- ======================================================= -->
  <header class="barra">
    <div class="marca">
      <img src="img/icono.png" class="marca-icono" alt="">
      <span class="marca-jhf">JHF</span><span class="marca-desafios">Desafios</span>
    </div>

    <div class="desafio-titulo">
      <span id="desafioGrupo" class="desafio-grupo"></span>
      <span id="desafioNombre" class="desafio-nombre"></span>
    </div>

    <div class="acciones">
      <button id="btnAnterior" type="button" class="chico" title="Desafio anterior">&#8249;</button>
      <button id="btnLista" type="button">Desafios</button>
      <button id="btnSiguiente" type="button" class="chico" title="Desafio siguiente">&#8250;</button>
    </div>
  </header>

  <main>
    <div class="lado-bloques">
      <div id="espacioTrabajo"></div>
    </div>

    <aside class="lado-tablero">
      <div class="consigna">
        <p id="consignaTexto"></p>
        <button id="btnAyuda" type="button" class="enlace">Una ayudita</button>
        <p id="ayudaTexto" class="ayuda"></p>
      </div>

      <div class="tablero-caja">
        <canvas id="tablero"></canvas>
        <div id="cartel" class="cartel"></div>
      </div>

      <div class="controles">
        <button id="btnEjecutar" type="button" class="destacado">Ejecutar</button>
        <button id="btnReiniciar" type="button">Volver al inicio</button>

        <div class="velocidad">
          <label for="selectorVelocidad">Velocidad</label>
          <select id="selectorVelocidad">
            <option value="700">lenta</option>
            <option value="380" selected>normal</option>
            <option value="150">rapida</option>
          </select>
        </div>
      </div>
    </aside>
  </main>

  <dialog id="lista">
    <h2>Desafios</h2>
    <div id="listaContenido"></div>
    <button id="cerrarLista" type="button">Cerrar</button>
  </dialog>

  <!-- LIBRERÍAS DE BLOCKLY Y LOGICA DEL JUEGO -->
  <script src="lib/blockly/blockly_compressed.js"></script>
  <script src="lib/blockly/blocks_compressed.js"></script>
  <script src="lib/blockly/msg/es.js"></script>
  <script src="js/escenario.js"></script>
  <script src="js/tablero.js"></script>
  <script src="js/bloques.js"></script>
  <script src="js/interprete.js"></script>
  <script src="js/desafios.js"></script>
  <script src="js/app.js"></script>

  <!-- SCRIPT DE CONTROL PARA ACCEDER AL JUEGO -->
  <script>
    document.getElementById('btnJugarOnline').addEventListener('click', function() {
      // Ocultar la capa de bienvenida
      document.getElementById('pantallaBienvenida').classList.add('ocultar-pantalla');

      // Forzar recálculo del espacio de trabajo de Blockly
      if (window.Blockly) {
        Blockly.svgResize(Blockly.getMainWorkspace());
      }
    });
  </script>
</body>
</html>
