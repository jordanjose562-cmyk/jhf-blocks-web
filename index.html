<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>JHF Desafios</title>
  
  <!-- Carga correcta del estilo principal -->
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <!-- PANTALLA DE INICIO OVERLAY (NO OCULTA EL DOM DEL JUEGO) -->
  <div id="pantallaInicio" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box;">
    
    <div style="margin-bottom: 25px;">
      <img src="img/icono.png" alt="JHF Logo" style="width: 80px; height: 80px; margin-bottom: 10px;">
      <h1 style="font-size: 2.2rem; color: #333; margin: 0;">Bienvenido a JHF Desafíos</h1>
      <p style="color: #666; max-width: 500px; margin-top: 10px;">Aprende lógica y conceptos de programación resolviendo los retos interactivos con bloques.</p>
    </div>

    <!-- BOTÓN DE INICIO -->
    <button id="btnEntrarJuego" type="button" style="font-size: 1.4rem; padding: 15px 35px; background-color: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15); margin-bottom: 35px;">
      ¡Programá y divertite!
    </button>

    <!-- SECCIÓN DE DESCARGAS -->
    <div style="background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 10px; padding: 20px 30px; max-width: 450px; width: 100%;">
      <h3 style="margin-top: 0; color: #495057;">Descarga la aplicación</h3>
      <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <a href="descargas/JHF-Desafios-Windows.exe" style="padding: 10px 18px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 0.9rem;" download>Windows</a>
        <a href="descargas/JHF-Desafios-Android.apk" style="padding: 10px 18px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 0.9rem;" download>Android</a>
        <a href="descargas/JHF-Desafios-Linux.AppImage" style="padding: 10px 18px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 0.9rem;" download>Linux</a>
      </div>
    </div>
  </div>

  <!-- ESTRUCTURA INTACTA DEL JUEGO ORIGINAL -->
  <header class="barra">
    <div class="marca">
      <img src="img/icono.png" class="marca-icono" alt="">
      <span class="marca-jhf">JHF</span><span class="marca-desafios">Desafios</span>
    </div>

    <div class="desafio-titulo">
      <span id="desafioGrupo" class="desafio-grupo"></span>
      <span id="desafioNombre" class="desafio-nombre"></span>
    </div>

    <div class="acciones">
      <button id="btnAnterior" type="button" class="chico" title="Desafio anterior">&#8249;</button>
      <button id="btnLista" type="button">Desafios</button>
      <button id="btnSiguiente" type="button" class="chico" title="Desafio siguiente">&#8250;</button>
    </div>
  </header>

  <main>
    <div class="lado-bloques">
      <div id="espacioTrabajo"></div>
    </div>

    <aside class="lado-tablero">
      <div class="consigna">
        <p id="consignaTexto"></p>
        <button id="btnAyuda" type="button" class="enlace">Una ayudita</button>
        <p id="ayudaTexto" class="ayuda"></p>
      </div>

      <div class="tablero-caja">
        <canvas id="tablero"></canvas>
        <div id="cartel" class="cartel"></div>
      </div>

      <div class="controles">
        <button id="btnEjecutar" type="button" class="destacado">Ejecutar</button>
        <button id="btnReiniciar" type="button">Volver al inicio</button>

        <div class="velocidad">
          <label for="selectorVelocidad">Velocidad</label>
          <select id="selectorVelocidad">
            <option value="700">lenta</option>
            <option value="380" selected>normal</option>
            <option value="150">rapida</option>
          </select>
        </div>
      </div>
    </aside>
  </main>

  <dialog id="lista">
    <h2>Desafios</h2>
    <div id="listaContenido"></div>
    <button id="cerrarLista" type="button">Cerrar</button>
  </dialog>

  <!-- SCRIPTS ORIGINALES DEL PROYECTO -->
  <script src="lib/blockly/blockly_compressed.js"></script>
  <script src="lib/blockly/blocks_compressed.js"></script>
  <script src="lib/blockly/msg/es.js"></script>
  <script src="js/escenario.js"></script>
  <script src="js/tablero.js"></script>
  <script src="js/bloques.js"></script>
  <script src="js/interprete.js"></script>
  <script src="js/desafios.js"></script>
  <script src="js/app.js"></script>

  <!-- CONTROLADOR DE TRANSICIÓN Y REDIMENSIONADO DE BLOCKLY -->
  <script>
    document.getElementById('btnEntrarJuego').addEventListener('click', function() {
      // Ocultar pantalla inicial
      document.getElementById('pantallaInicio').style.display = 'none';

      // Forzar recálculo del lienzo de Blockly al quedar visible el área
      setTimeout(function() {
        if (window.Blockly) {
          Blockly.svgResize(Blockly.getMainWorkspace());
        }
      }, 50);
    });
  </script>
</body>
</html>
